<!-- Fullscreen Intro Video Overlay (Plays On Landing Page & Whenever Refreshed) -->
<div id="intro-overlay" class="intro-overlay" aria-hidden="true">
  <video id="intro-video" 
         class="intro-video" 
         src="{{ url_for('static', filename='videos/batman_intro.mp4') }}" 
         playsinline 
         webkit-playsinline 
         muted 
         preload="auto"
         tabindex="-1">
  </video>

  <!-- Atmospheric Mysterious Dark Shadow Overlay -->
  <div class="intro-mysterious-shadow" aria-hidden="true"></div>

  <!-- Elegant Liquid Glass "Skip Intro" Button -->
  <button type="button" id="intro-skip-btn" class="intro-skip-btn" aria-label="Skip Intro">
    <span>Skip Intro</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="5 4 15 12 5 20 5 4"></polygon>
      <line x1="19" y1="5" x2="19" y2="19"></line>
    </svg>
  </button>
</div>

<style>
/* Fullscreen Intro Overlay Styling */
.intro-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999999;
  background-color: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  opacity: 1;
  transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity;
  pointer-events: auto;
}

.intro-overlay.fade-out {
  opacity: 0;
  pointer-events: none;
}

/* Mysterious, Stealth Blacked-In Dark Knight Video Grade */
.intro-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background-color: #000000;
  filter: brightness(0.76) contrast(1.24) saturate(0.88);
  -webkit-filter: brightness(0.76) contrast(1.24) saturate(0.88);
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  will-change: transform, opacity;
}

/* Atmospheric Mysterious Vignette & Cinematic Shadow Overlay */
.intro-mysterious-shadow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background: 
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0.22) 18%, rgba(0, 0, 0, 0.65) 65%, rgba(0, 0, 0, 0.96) 100%),
    linear-gradient(to bottom, rgba(0, 0, 0, 0.65) 0%, transparent 20%, transparent 80%, rgba(0, 0, 0, 0.75) 100%);
}

/* Small, Elegant Skip Intro Button */
.intro-skip-btn {
  position: absolute;
  bottom: 2rem;
  right: 2rem;
  z-index: 10000000;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 1.15rem;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
  font-size: 13px;
  font-weight: 550;
  letter-spacing: 0.02em;
  color: rgba(255, 255, 255, 0.9);
  background: rgba(18, 16, 26, 0.65);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 9999px;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  outline: none;
  user-select: none;
}

.intro-skip-btn:hover {
  background: rgba(32, 28, 44, 0.88);
  color: #FFFFFF;
  border-color: rgba(255, 255, 255, 0.32);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.intro-skip-btn:active {
  transform: translateY(0) scale(0.97);
}

/* Mobile & Tablet Adjustments */
@media (max-width: 640px) {
  .intro-skip-btn {
    bottom: 1.25rem;
    right: 1.25rem;
    padding: 0.45rem 0.95rem;
    font-size: 12px;
  }
}
</style>

<script>
(function() {
  window.__DOCEXPO_INTRO_ACTIVE__ = true;

  const overlay = document.getElementById('intro-overlay');
  const video = document.getElementById('intro-video');
  const skipBtn = document.getElementById('intro-skip-btn');
  let dismissed = false;

  function dismissIntro() {
    if (dismissed) return;
    dismissed = true;

    // Immediately awaken all WebGL background renderers
    window.__DOCEXPO_INTRO_ACTIVE__ = false;
    try {
      window.dispatchEvent(new CustomEvent('docexpo:intro-dismissed'));
    } catch (e) {}

    if (overlay) {
      overlay.classList.add('fade-out');
      if (video) {
        try { video.pause(); } catch (e) {}
      }
      setTimeout(() => {
        try { overlay.remove(); } catch (e) {}
      }, 850);
    }
  }

  if (skipBtn) {
    skipBtn.addEventListener('click', (e) => {
      e.preventDefault();
      dismissIntro();
    });
  }

  if (video) {
    // When video ends naturally, smoothly fade away
    video.addEventListener('ended', dismissIntro);

    // Fallback if video fails to load or decode
    video.addEventListener('error', dismissIntro);

    // Dynamic safety timeout upon active playback
    video.addEventListener('playing', () => {
      const dur = (video.duration && !isNaN(video.duration)) ? video.duration : 6.0;
      setTimeout(dismissIntro, Math.round((dur + 1.2) * 1000));
    }, { once: true });

    // Safety fallback if video never starts
    setTimeout(() => {
      if (!dismissed && video.currentTime < 0.1) {
        dismissIntro();
      }
    }, 4500);

    // Start playback as soon as ready
    video.muted = true;
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch((err) => {
        video.muted = true;
        video.play().catch(dismissIntro);
      });
    }
  } else {
    dismissIntro();
  }
})();
</script>

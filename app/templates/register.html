{% extends "base.html" %}

{% block title %}Create Workspace — DocExpo{% endblock %}

{% block public_content %}
<!-- Live ReactBits Antigravity WebGL 2 Background -->
<div id="antigravity-container" style="position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; background: #000000;">
  <canvas id="antigravity-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
</div>

<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; position: relative; z-index: 10;">
  <div style="width: 100%; max-width: 460px;">
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="brand-logo-group" style="justify-content: center; margin-bottom: 1.5rem;">
        <div class="brand-logo-badge" style="width: 48px; height: 48px; border-radius: 14px;">
          <div class="brand-glyph-overlay">
            <img src="{{ url_for('static', filename='images/batman_logo_3d.png') }}" alt="Batman Emblem" class="batman-logo-img" style="max-width: 40px; max-height: 24px;">
          </div>
        </div>
        <div class="brand-name-wrap">
          <span class="brand-name" style="font-size: 1.4rem;">DocExpo</span>
          <span class="brand-edition">INTELLIGENCE</span>
        </div>
      </a>

      <h1 style="font-size: 1.85rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.4rem; color: #FFFFFF;">
        Create your workspace.
      </h1>
      <p style="color: rgba(240, 240, 248, 0.75); font-size: 14px;">
        Start exploring documents with grounded AI intelligence.
      </p>
    </div>

    <!-- True Translucent Liquid Glass Card -->
    <div class="liquid-glass-card" style="padding: 2.75rem 2.25rem;">
      <form id="register-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="reg-name" style="display: block; margin-bottom: 0.5rem; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.85);">
            Full Name
          </label>
          <input type="text" id="reg-name" class="liquid-glass-input" placeholder="e.g. Alex Johnson" required autocomplete="name">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="reg-email" style="display: block; margin-bottom: 0.5rem; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.85);">
            Email Address
          </label>
          <input type="email" id="reg-email" class="liquid-glass-input" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem;">
            <label class="form-label" for="reg-password" style="margin-bottom: 0; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.85);">
              Password
            </label>
            <button type="button" id="toggle-reg-pwd-label" class="btn-ghost" style="padding: 0; font-size: 12px; color: var(--accent-lavender); cursor: pointer; background: none; border: none;">
              Show
            </button>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="reg-password" class="liquid-glass-input" placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" id="toggle-reg-pwd-btn" class="password-toggle-btn" aria-label="Show password" title="Toggle password visibility">
              <!-- Eye Icon (Open) -->
              <svg class="eye-open-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye Icon (Closed/Slash) -->
              <svg class="eye-closed-icon" viewBox="0 0 24 24" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.6rem;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem;">
            <label class="form-label" for="reg-password-confirm" style="margin-bottom: 0; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.85);">
              Confirm Password
            </label>
            <button type="button" id="toggle-reg-confirm-label" class="btn-ghost" style="padding: 0; font-size: 12px; color: var(--accent-lavender); cursor: pointer; background: none; border: none;">
              Show
            </button>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="reg-password-confirm" class="liquid-glass-input" placeholder="Re-enter your password" required autocomplete="new-password">
            <button type="button" id="toggle-reg-confirm-btn" class="password-toggle-btn" aria-label="Show password" title="Toggle password visibility">
              <!-- Eye Icon (Open) -->
              <svg class="eye-open-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye Icon (Closed/Slash) -->
              <svg class="eye-closed-icon" viewBox="0 0 24 24" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div id="reg-error-msg" class="form-error" style="display: none; margin-bottom: 1.25rem;"></div>

        <button type="submit" id="btn-reg-submit" class="btn-star-border" data-star-color="#FF9FFC" data-star-trail="#B9A7FF" style="width: 100%; padding: 0.9rem; font-size: 15px;">
          <span>Create Workspace</span>
        </button>
      </form>
    </div>

    <!-- Switch to Login -->
    <div style="text-align: center; margin-top: 1.75rem; font-size: 14px; color: rgba(255, 255, 255, 0.65);">
      Already have an account? <a href="{{ url_for('auth.login_page') }}" style="color: var(--accent-lavender); font-weight: 500; text-decoration: underline; text-underline-offset: 4px;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- ReactBits Live Engines -->
<script src="{{ url_for('static', filename='js/antigravity.js') }}"></script>
<script src="{{ url_for('static', filename='js/star_border.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  function setupPasswordToggle(inputId, btnId, labelId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    const label = document.getElementById(labelId);
    
    function toggle() {
      if (!input) return;
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      
      const eyeOpen = btn ? btn.querySelector('.eye-open-icon') : null;
      const eyeClosed = btn ? btn.querySelector('.eye-closed-icon') : null;
      if (eyeOpen && eyeClosed) {
        eyeOpen.style.display = isPwd ? 'none' : 'block';
        eyeClosed.style.display = isPwd ? 'block' : 'none';
      }
      if (label) {
        label.textContent = isPwd ? 'Hide' : 'Show';
      }
      if (btn) {
        btn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
      }
      input.focus();
    }
    
    if (btn) btn.addEventListener('click', toggle);
    if (label) label.addEventListener('click', toggle);
  }

  setupPasswordToggle('reg-password', 'toggle-reg-pwd-btn', 'toggle-reg-pwd-label');
  setupPasswordToggle('reg-password-confirm', 'toggle-reg-confirm-btn', 'toggle-reg-confirm-label');

  const regForm = document.getElementById('register-form');
  const errorMsg = document.getElementById('reg-error-msg');
  const submitBtn = document.getElementById('btn-reg-submit');

  if (regForm) {
    regForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const fullName = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-password-confirm').value;

      if (!fullName) {
        errorMsg.textContent = 'Please enter your full name.';
        errorMsg.style.display = 'block';
        return;
      }
      if (!email) {
        errorMsg.textContent = 'Please enter a valid email address.';
        errorMsg.style.display = 'block';
        return;
      }
      if (!password || password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters.';
        errorMsg.style.display = 'block';
        return;
      }
      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match. Please verify both password fields.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            full_name: fullName, 
            email: email, 
            password: password,
            confirm_password: confirmPassword,
            confirmPassword: confirmPassword 
          })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Registration failed.');
        }
        window.location.href = '/dashboard';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
      }
    });
  }
});
</script>
{% endblock %}
